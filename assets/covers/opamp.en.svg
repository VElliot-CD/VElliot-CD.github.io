<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Two-stage CMOS amplifier with Miller compensation</title>
  <desc id="desc">Simplified functional cover diagram of two amplifier stages. The Miller compensation capacitor connects the first-stage output to the amplifier output. The diagram is not a transistor schematic or an external feedback circuit.</desc>
  <rect width="1200" height="560" fill="#f4f1e9"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#17322f">
    <text x="64" y="119" font-size="76" font-weight="600" letter-spacing="-2">Two-stage CMOS</text>
    <path d="M66 153H190" stroke="#a4482b" stroke-width="7" stroke-linecap="round"/>
    <text x="815" y="197" text-anchor="middle" fill="#a4482b" font-size="48" font-weight="600">Miller compensation</text>
    <g fill="none" stroke="#526663" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M64 315H180M64 385H180M450 350H690M960 350H1136"/><path d="M536 350V237H783M811 237H1042V350" stroke="#a4482b"/><path d="M783 214V260M811 214V260" stroke="#a4482b" stroke-width="8"/></g>
    <circle cx="536" cy="350" r="8" fill="#526663"/><circle cx="1042" cy="350" r="8" fill="#526663"/>
    <path d="M180 280 450 350 180 440Z" fill="#e2e9df" stroke="#c7cec2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M690 280 960 350 690 440Z" fill="#17322f" stroke="#17322f" stroke-width="3" stroke-linejoin="round"/>
    <g text-anchor="middle" font-size="74" font-weight="600"><text x="278" y="375">1</text><text x="788" y="375" fill="#fffdf8">2</text></g>
    <g font-size="44" text-anchor="middle" font-weight="400"><text x="216" y="321">+</text><text x="216" y="402">−</text></g>
    <g text-anchor="middle" font-size="48" font-weight="500"><text x="283" y="522">Input stage</text><text x="793" y="522">Output stage</text></g>
  </g>
</svg>
