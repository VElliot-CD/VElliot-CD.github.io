    <style>
:root {
  color-scheme: light;
  --paper: #f4f1e9;
  --paper-deep: #ebe6da;
  --surface: #fffdf8;
  --ink: #17322f;
  --ink-soft: #526663;
  --accent: #b04f30;
  --accent-soft: #f1d8cb;
  --line: #d9d4c8;
  --shadow: 0 24px 60px rgba(25, 45, 42, 0.12);
  --radius: 22px;
  --shell: min(1120px, calc(100% - 48px));
  --serif: Georgia, "Times New Roman", "Noto Serif SC", serif;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --paper: #101b1a;
  --paper-deep: #172422;
  --surface: #1d2d2a;
  --ink: #edf1ea;
  --ink-soft: #afbfba;
  --accent: #e1845f;
  --accent-soft: #4c2e24;
  --line: #344743;
  --shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 92px;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  text-rendering: optimizeLegibility;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
}

img {
  display: block;
  max-width: 100%;
}

.shell {
  width: var(--shell);
  margin-inline: auto;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: fixed;
  z-index: 1000;
  top: 10px;
  left: 10px;
  padding: 10px 14px;
  transform: translateY(-150%);
  border-radius: 10px;
  background: var(--ink);
  color: var(--paper);
}

.skip-link:focus {
  transform: translateY(0);
}

.site-header {
  position: sticky;
  z-index: 100;
  top: 0;
  border-bottom: 1px solid transparent;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(16px);
  transition: border-color 180ms ease;
}

.site-header.is-scrolled {
  border-color: var(--line);
}

.header-inner {
  display: flex;
  min-height: 76px;
  align-items: center;
  gap: 22px;
}

.wordmark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-right: auto;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.wordmark-mark {
  color: var(--accent);
  font-size: 24px;
}

.site-nav {
  display: flex;
  align-items: center;
  gap: 22px;
}

.site-nav a {
  color: var(--ink-soft);
  font-size: 14px;
  font-weight: 650;
  transition: color 150ms ease;
}

.site-nav a:hover,
.site-nav a:focus-visible {
  color: var(--accent);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.text-button,
.icon-button,
.menu-button {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}

.text-button,
.icon-button {
  display: grid;
  height: 38px;
  min-width: 38px;
  place-items: center;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 750;
}

.icon-button {
  font-size: 17px;
}

.menu-button {
  display: none;
}

.hero {
  display: grid;
  min-height: 680px;
  padding-block: 86px 100px;
  align-items: center;
  grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
  gap: clamp(60px, 10vw, 130px);
}

.eyebrow,
.section-kicker {
  margin: 0 0 14px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.hero h1 {
  max-width: 720px;
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(54px, 8vw, 94px);
  font-weight: 500;
  letter-spacing: -0.065em;
  line-height: 0.98;
}

.hero-role {
  margin: 28px 0 0;
  color: var(--ink);
  font-size: clamp(18px, 2vw, 22px);
  font-weight: 700;
}

.hero-summary {
  max-width: 670px;
  margin: 18px 0 0;
  color: var(--ink-soft);
  font-size: 17px;
}

.hero-actions,
.contact-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 32px;
}

.button {
  display: inline-flex;
  min-height: 46px;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 10px 18px;
  border: 1px solid var(--ink);
  border-radius: 999px;
  font-size: 14px;
  font-weight: 750;
  transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
}

.button:hover {
  transform: translateY(-2px);
}

.button-primary {
  background: var(--ink);
  color: var(--paper);
}

.button-secondary {
  background: transparent;
  color: var(--ink);
}

.button-placeholder,
.button-placeholder:hover {
  cursor: default;
  opacity: 0.62;
  transform: none;
}

.quick-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 24px;
  margin: 34px 0 0;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.quick-facts div {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-soft);
  font-size: 14px;
}

.quick-facts dt {
  color: var(--accent);
}

.quick-facts dd {
  margin: 0;
}

.portrait-wrap {
  position: relative;
  width: min(100%, 360px);
  justify-self: center;
}

.portrait-backdrop {
  position: absolute;
  inset: -18px 18px 18px -18px;
  border: 1px solid var(--accent);
  border-radius: 45% 45% 18px 18px;
  transform: rotate(-3deg);
}

.portrait {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  border-radius: 45% 45% 18px 18px;
  object-fit: cover;
  box-shadow: var(--shadow);
}

.availability {
  position: absolute;
  right: -22px;
  bottom: 28px;
  display: flex;
  max-width: 220px;
  align-items: center;
  gap: 9px;
  padding: 12px 15px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 12px 30px rgba(22, 43, 40, 0.14);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
}

.availability::before {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #4f9a6b;
  box-shadow: 0 0 0 4px rgba(79, 154, 107, 0.15);
  content: "";
}

.stats-band {
  border-block: 1px solid var(--line);
  background: var(--surface);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}

.stat {
  padding: 32px 28px;
  border-right: 1px solid var(--line);
}

.stat:first-child {
  padding-left: 0;
}

.stat:last-child {
  border-right: 0;
}

.stat-value {
  display: block;
  margin-bottom: 4px;
  font-family: var(--serif);
  font-size: 34px;
  line-height: 1.1;
}

.stat-label {
  color: var(--ink-soft);
  font-size: 13px;
}

.section {
  padding-block: 118px;
}

.section-heading {
  max-width: 760px;
  margin-bottom: 52px;
}

.section-heading h2,
.contact-inner h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(38px, 5vw, 62px);
  font-weight: 500;
  letter-spacing: -0.045em;
  line-height: 1.08;
}

.section-heading > p:last-child,
.heading-row > p,
.contact-inner p {
  margin: 18px 0 0;
  color: var(--ink-soft);
}

.heading-row {
  display: grid;
  max-width: none;
  align-items: end;
  grid-template-columns: 1fr minmax(260px, 0.55fr);
  gap: 60px;
}

.heading-row > p {
  margin-bottom: 4px;
}

.news-section {
  padding-block: 104px 116px;
}

.news-list {
  border-block: 1px solid var(--line);
}

.news-item {
  display: grid;
  padding: 26px 0;
  border-bottom: 1px solid var(--line);
  grid-template-columns: 150px 1fr;
  gap: 34px;
}

.news-item:last-child {
  border-bottom: 0;
}

.news-item time {
  color: var(--accent);
  font-family: var(--serif);
  font-size: 16px;
}

.news-item h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 23px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.25;
}

.news-item p {
  max-width: 720px;
  margin: 8px 0 0;
  color: var(--ink-soft);
  font-size: 14px;
}

.research-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.research-card {
  min-height: 300px;
  padding: 30px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  transition: transform 180ms ease, box-shadow 180ms ease;
}

.research-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow);
}

.card-number {
  color: var(--accent);
  font-family: var(--serif);
  font-size: 16px;
}

.research-card h3,
.project-card h3 {
  margin: 58px 0 12px;
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1.2;
}

.research-card p,
.project-card p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 14px;
}

.focus-panel {
  display: grid;
  margin-top: 24px;
  padding: 34px;
  align-items: start;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    radial-gradient(circle at top right, color-mix(in srgb, var(--accent-soft) 78%, transparent), transparent 34%),
    var(--surface);
  grid-template-columns: minmax(0, 0.82fr) minmax(320px, 1fr);
  gap: 44px;
}

.focus-panel h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(28px, 3vw, 38px);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.12;
}

.focus-panel p {
  margin: 14px 0 0;
  color: var(--ink-soft);
}

.focus-panel ul {
  display: grid;
  margin: 0;
  padding: 0;
  gap: 14px;
  list-style: none;
}

.focus-panel li {
  position: relative;
  padding: 14px 16px 14px 42px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  color: var(--ink-soft);
  font-size: 14px;
}

.focus-panel li::before {
  position: absolute;
  top: 19px;
  left: 18px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  content: "";
}

.section-projects,
.section-experience {
  background: var(--paper-deep);
}

.project-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: -22px 0 30px;
}

.filter-button,
.project-detail-button,
.modal-close {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  font-weight: 760;
  transition: transform 150ms ease, border-color 150ms ease, background-color 150ms ease, color 150ms ease;
}

.filter-button {
  padding: 8px 13px;
  border-radius: 999px;
}

.filter-button:hover,
.filter-button:focus-visible,
.project-detail-button:hover,
.project-detail-button:focus-visible,
.modal-close:hover,
.modal-close:focus-visible {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.filter-button.is-active {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--paper);
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}

.project-card {
  position: relative;
  display: flex;
  min-height: 590px;
  padding: 34px;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}

.project-card::after {
  position: absolute;
  top: -90px;
  right: -70px;
  width: 230px;
  height: 230px;
  border: 1px solid var(--accent-soft);
  border-radius: 50%;
  box-shadow: 0 0 0 34px var(--accent-soft);
  content: "";
  opacity: 0.48;
}

.project-card h3 {
  max-width: 78%;
  margin-top: 72px;
}

.project-highlights {
  display: grid;
  margin: 22px 0 0;
  padding-left: 18px;
  gap: 10px;
  color: var(--ink-soft);
  font-size: 13px;
  line-height: 1.55;
}

.project-highlights li::marker {
  color: var(--accent);
}

.project-meta,
.tag-list,
.publication-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.project-meta {
  position: relative;
  z-index: 1;
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.tag-list {
  margin-top: auto;
  padding-top: 28px;
}

.project-card-footer {
  display: grid;
  margin-top: auto;
  padding-top: 28px;
  gap: 18px;
}

.project-card-footer .tag-list {
  margin-top: 0;
  padding-top: 0;
}

.project-detail-button {
  width: max-content;
  padding: 9px 14px;
  border-radius: 999px;
}

.tag {
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 700;
}

.inline-link,
.publication-link {
  color: var(--accent);
  font-size: 13px;
  font-weight: 750;
}

.inline-link::after,
.publication-link::after {
  content: " ↗";
}

.inline-placeholder {
  cursor: default;
  opacity: 0.62;
  pointer-events: none;
}

.inline-placeholder::after {
  content: "";
}

.is-hidden {
  display: none !important;
}

.publication-list {
  margin: 0;
  padding: 0;
  list-style: none;
  counter-reset: publications;
}

.publication-item {
  display: grid;
  padding: 30px 0;
  border-top: 1px solid var(--line);
  counter-increment: publications;
  grid-template-columns: 52px 1fr auto;
  gap: 20px;
}

.publication-item:last-child {
  border-bottom: 1px solid var(--line);
}

.publication-item::before {
  color: var(--accent);
  content: "0" counter(publications);
  font-family: var(--serif);
  font-size: 15px;
}

.publication-item h3 {
  margin: 0 0 8px;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.3;
}

.publication-authors,
.publication-venue {
  margin: 0;
  color: var(--ink-soft);
  font-size: 13px;
}

.publication-venue {
  margin-top: 4px;
  font-style: italic;
}

.publication-note {
  max-width: 760px;
  margin: 12px 0 0;
  color: var(--ink-soft);
  font-size: 14px;
}

.publication-links {
  align-content: start;
  justify-content: flex-end;
}

.experience-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 90px;
}

.experience-column {
  display: grid;
  align-content: start;
  gap: 56px;
}

.subsection-title {
  margin: 0 0 28px;
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 500;
}

.timeline-item {
  position: relative;
  padding: 0 0 38px 28px;
  border-left: 1px solid var(--line);
}

.timeline-item::before {
  position: absolute;
  top: 8px;
  left: -5px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  content: "";
}

.timeline-item:last-child {
  padding-bottom: 0;
}

.timeline-item h4,
.award-item h4 {
  margin: 0;
  font-size: 16px;
}

.timeline-item p,
.award-item p {
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 13px;
}

.timeline-date {
  color: var(--accent) !important;
  font-weight: 750;
}

.award-list {
  border-top: 1px solid var(--line);
}

.award-item {
  display: grid;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  grid-template-columns: 1fr auto;
  gap: 20px;
}

.award-year {
  color: var(--accent) !important;
  font-family: var(--serif);
}

.skill-groups {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.skill-group {
  padding-top: 22px;
  border-top: 2px solid var(--ink);
}

.skill-group h3 {
  margin: 0 0 18px;
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 500;
}

.skill-group ul {
  margin: 0;
  padding: 0;
  color: var(--ink-soft);
  list-style: none;
}

.skill-group li + li {
  margin-top: 7px;
}

.contact-section {
  padding-block: 100px;
  background: var(--ink);
  color: var(--paper);
}

.contact-inner {
  display: grid;
  align-items: center;
  grid-template-columns: 1.25fr 0.75fr;
  gap: 70px;
}

.contact-inner p {
  color: color-mix(in srgb, var(--paper) 75%, transparent);
}

.contact-inner .section-kicker {
  color: var(--accent);
}

.contact-actions {
  justify-content: flex-end;
  margin-top: 0;
}

.contact-actions .button {
  border-color: var(--paper);
}

.contact-actions .button-primary {
  background: var(--paper);
  color: var(--ink);
}

.contact-actions .button-secondary {
  color: var(--paper);
}

.site-footer {
  background: var(--ink);
  color: color-mix(in srgb, var(--paper) 65%, transparent);
}

.modal-open {
  overflow: hidden;
}

.modal-backdrop {
  position: fixed;
  z-index: 300;
  inset: 0;
  display: grid;
  padding: 24px;
  place-items: center;
  background: color-mix(in srgb, var(--ink) 48%, transparent);
  backdrop-filter: blur(12px);
}

.project-modal {
  position: relative;
  width: min(920px, 100%);
  max-height: min(88vh, 900px);
  overflow: auto;
  padding: 42px;
  border: 1px solid var(--line);
  border-radius: 30px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

    renderProjectModal(index);
    $("#project-modal").classList.remove("is-hidden");
    $("#project-modal").setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");
    setPageInert(true);
    $("#modal-close")?.focus();
  }

  function closeProjectModal() {
    const returnFocus = modalReturnFocus;
    $("#project-modal").classList.add("is-hidden");
    $("#project-modal").setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
    setPageInert(false);
    activeProjectIndex = null;
    modalReturnFocus = null;
    requestAnimationFrame(() => returnFocus?.focus());
  }

  function trapModalFocus(event) {
    if (event.key !== "Tab" || $("#project-modal").classList.contains("is-hidden")) return;
    const focusable = $$(
      "#project-modal button:not([disabled]), #project-modal a[href], #project-modal input:not([disabled]), #project-modal select:not([disabled]), #project-modal textarea:not([disabled]), #project-modal [tabindex]:not([tabindex='-1'])"
    ).filter((node) => !node.hidden && node.getClientRects().length > 0);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function render() {
    const content = data[language];
    const settings = data.settings;
    const isZh = language === "zh";

    document.documentElement.lang = isZh ? "zh-CN" : "en";
    document.title = content.meta.title;
    setMeta("meta[name='description']", "content", content.meta.description);
    setMeta("meta[property='og:title']", "content", content.meta.title);
    setMeta("meta[property='og:description']", "content", content.meta.description);
    setMeta("meta[property='og:url']", "content", settings.siteUrl);
    setMeta("meta[property='og:image']", "content", settings.ogImage?.startsWith("http") ? settings.ogImage : `${settings.siteUrl}${settings.ogImage || "assets/og-card.png"}`);
    setMeta("meta[name='twitter:title']", "content", content.meta.title);
    setMeta("meta[name='twitter:description']", "content", content.meta.description);
    setMeta("meta[name='twitter:image']", "content", settings.ogImage?.startsWith("http") ? settings.ogImage : `${settings.siteUrl}${settings.ogImage || "assets/og-card.png"}`);

    text("#skip-link", content.ui.skip);
    text("#wordmark", content.profile.name);
    text("#language-toggle", content.ui.language);
    $("#language-toggle")?.setAttribute("aria-label", content.ui.languageLabel);
    $("#theme-toggle")?.setAttribute("aria-label", content.ui.theme);
    $("#menu-button .sr-only")?.replaceChildren(document.createTextNode(content.ui.menu));
    text("#back-to-top", content.ui.backToTop);

    Object.entries(content.nav).forEach(([key, value]) => {
      text(`[data-nav="${key}"]`, value);
    });

    text("#hero-eyebrow", content.profile.eyebrow);
    text("#hero-name", content.profile.name);
    text("#hero-role", `${content.profile.role} · ${content.profile.organization}`);
    text("#hero-summary", content.profile.summary);
    text("#availability", content.profile.status);
    $("#portrait").src = settings.photo || "assets/profile-monogram.svg";
    $("#portrait").alt = content.profile.photoAlt;

    const cvAction = settings.cvUrl ? button(content.ui.cv, settings.cvUrl, "secondary", true) : "";
    $("#hero-actions").innerHTML = button(content.ui.researchCta, "#projects", "primary") + cvAction;

    const facts = [
      ["⌖", content.profile.location],
      ["✉", settings.email],
    ].filter(([, value]) => value);
    $("#quick-facts").innerHTML = facts
      .map(([icon, value]) => `<div><dt aria-hidden="true">${icon}</dt><dd>${escapeHtml(value)}</dd></div>`)
      .join("");

    $("#stats-grid").innerHTML = content.stats
      .map((item) => `<div class="stat"><strong class="stat-value">${escapeHtml(item.value)}</strong><span class="stat-label">${escapeHtml(item.label)}</span></div>`)
      .join("");

    renderNews(content);

    text("#research-kicker", content.research.kicker);
    text("#research-title", content.research.title);
    text("#research-intro", content.research.intro);
    $("#research-grid").innerHTML = content.research.items
      .map((item, index) => `<article class="research-card reveal"><span class="card-number">0${index + 1}</span><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.description)}</p></article>`)
      .join("");
    renderFocusPanel(content);

    text("#projects-kicker", content.projects.kicker);
    text("#projects-title", content.projects.title);
    text("#projects-intro", content.projects.intro);
    renderProjectFilters(content);
    renderProjects(content);

    text("#publications-kicker", content.publications.kicker);
    text("#publications-title", content.publications.title);
    const scholar = $("#scholar-link");
    if (settings.scholarUrl) {
      scholar.href = settings.scholarUrl;
      scholar.textContent = content.ui.scholar;
      scholar.removeAttribute("aria-disabled");
      scholar.setAttribute("target", "_blank");
      scholar.setAttribute("rel", "noreferrer");
      scholar.classList.remove("is-hidden", "inline-placeholder");
    } else {
      scholar.removeAttribute("href");
      scholar.removeAttribute("target");
      scholar.removeAttribute("rel");
      scholar.textContent = "";
      scholar.removeAttribute("aria-disabled");
      scholar.classList.add("is-hidden");
      scholar.classList.remove("inline-placeholder");
    }
    $("#publication-list").innerHTML = content.publications.items
      .map((item) => {
        const links = (item.links || [])
          .filter((link) => link.url)
          .map((link) => `<a class="publication-link" href="${escapeHtml(link.url)}" target="_blank" rel="noreferrer">${escapeHtml(link.label)}</a>`)
          .join("");
        const note = item.note ? `<p class="publication-note">${escapeHtml(item.note)}</p>` : "";
        return `<li class="publication-item reveal"><div><h3>${escapeHtml(item.title)}</h3><p class="publication-authors">${escapeHtml(item.authors)}</p><p class="publication-venue">${escapeHtml(item.venue)}</p>${note}</div><div class="publication-links">${links}</div></li>`;
      })
      .join("");

    text("#experience-kicker", content.experience.kicker);
    text("#experience-title", content.experience.title);
    text("#education-title", content.experience.educationTitle);
    text("#positions-title", content.experience.positionsTitle);
    text("#awards-title", content.experience.awardsTitle);
    $("#education-list").innerHTML = content.experience.education
      .map((item) => `<article class="timeline-item reveal"><p class="timeline-date">${escapeHtml(item.date)}</p><h4>${escapeHtml(item.degree)}</h4><p>${escapeHtml(item.institution)}</p><p>${escapeHtml(item.detail)}</p></article>`)
      .join("");
    $("#positions-list").innerHTML = (content.experience.positions || [])
      .map((item) => `<article class="timeline-item reveal"><p class="timeline-date">${escapeHtml(item.date)}</p><h4>${escapeHtml(item.title)}</h4><p>${escapeHtml(item.organization)}</p><p>${escapeHtml(item.detail)}</p></article>`)
      .join("");
    $("#award-list").innerHTML = content.experience.awards
      .map((item) => `<article class="award-item reveal"><div><h4>${escapeHtml(item.title)}</h4><p>${escapeHtml(item.organization)}</p></div><p class="award-year">${escapeHtml(item.year)}</p></article>`)
      .join("");

    text("#skills-kicker", content.skills.kicker);
    text("#skills-title", content.skills.title);
    $("#skill-groups").innerHTML = content.skills.groups
      .map((group) => `<article class="skill-group reveal"><h3>${escapeHtml(group.title)}</h3><ul>${group.items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul></article>`)
      .join("");

    text("#contact-kicker", content.contact.kicker);
    text("#contact-title", content.contact.title);
    text("#contact-copy", content.contact.copy);
    const emailUrl = settings.email ? `mailto:${settings.email}` : "";
    const emailAction = emailUrl ? button(content.ui.email, emailUrl, "primary") : "";
    $("#contact-actions").innerHTML =
      emailAction +
      button(content.ui.github, settings.githubUrl, "secondary", true) +
      button(content.ui.orcid, settings.orcidUrl, "secondary", true);

    text("#footer-copy", content.footer.replace("{year}", new Date().getFullYear()));
    if (activeProjectIndex !== null && !$("#project-modal").classList.contains("is-hidden")) renderProjectModal(activeProjectIndex);
    observeReveals();
  }

  let revealObserver;
  function observeReveals() {
    revealObserver?.disconnect();
    if (!("IntersectionObserver" in window)) {
      $$(".reveal").forEach((node) => node.classList.add("is-visible"));
      return;
    }
    revealObserver = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            revealObserver.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12 }
    );
    $$(".reveal").forEach((node) => revealObserver.observe(node));
  }

  const languageButton = $("#language-toggle");
  languageButton?.addEventListener("click", () => {
    language = language === "en" ? "zh" : "en";
    render();
  });

  const preferredDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
  const storedTheme = getStored("academic-site-theme", preferredDark ? "dark" : "light");
  document.documentElement.dataset.theme = storedTheme;
  text(".theme-icon", storedTheme === "dark" ? "☀" : "☾");

  $("#theme-toggle")?.addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    text(".theme-icon", next === "dark" ? "☀" : "☾");
    setStored("academic-site-theme", next);
  });

  const menuButton = $("#menu-button");
  const nav = $("#site-nav");
  menuButton?.addEventListener("click", () => {
    const open = nav.classList.toggle("is-open");
    menuButton.setAttribute("aria-expanded", String(open));
  });
  $$("#site-nav a").forEach((link) =>
    link.addEventListener("click", () => {
      nav.classList.remove("is-open");
      menuButton.setAttribute("aria-expanded", "false");
    })
  );

  $("#modal-close")?.addEventListener("click", closeProjectModal);
  $("#project-modal")?.addEventListener("click", (event) => {
    if (event.target === $("#project-modal")) closeProjectModal();
  });
  window.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !$("#project-modal").classList.contains("is-hidden")) {
      event.preventDefault();
      closeProjectModal();
      return;
    }
    trapModalFocus(event);
  });

  window.addEventListener(
    "scroll",
    () => {
      $(".site-header").classList.toggle("is-scrolled", window.scrollY > 8);
    },
    { passive: true }
  );

  render();
})();

</script>
  </body>
</html>
